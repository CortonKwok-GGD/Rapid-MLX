# Golden-model registry for stress + bench.
#
# Precision policy (project-wide): correctness tests run on **8-bit**
# (or higher). The pipeline catches engine bugs in rapid-mlx; we don't
# want quant noise on 4-bit models producing failures that look like
# rapid-mlx bugs but are actually model-capability ceilings. Reserved
# 4-bit runs (perf benches) live in dedicated scripts:
#   - scripts/bench_dflash.py
#   - scripts/bench_suffix_decoding_integrated.py
#   - harness/runs/ (when explicitly targeting 4-bit user reality)
# A documented example of the 4-bit pitfall this policy avoids:
# Qwen3.6-27B-4bit + thinking + multi-tool composition reliably
# generates a 4000-token natural-language ramble without ever emitting
# a valid <tool_call> XML (proven 2026-05-15). The 8-bit variant emits
# both calls in 286 tokens. Identical engine code; quant noise was the
# only variable. Keep new candidates 8-bit unless the family has no
# 8-bit option (very rare today on mlx-community / unsloth).
#
# Each family is a logical model line (Qwen3, Qwen3.5, MiniMax …). The
# pipeline picks ONE candidate per family — the FIRST one (top-to-
# bottom in the candidates list) whose `ram_gb_required` fits on the
# current machine. If no candidate fits, the family is skipped. The
# selection is purely based on list order + RAM fit; `quality_tier` is
# NOT used to break ties or override ordering. Put your preferred
# candidate first — the next one(s) are fallbacks for constrained hosts.
# Source: scripts/pr_validate/steps/stress_e2e_bench.py::_select_models.
#
# `quality_tier` is mostly informational (display + scorecard labels).
# The ONE behavioral effect: `quality_tier: smoke` causes integration
# agents marked `skip_for_smoke: true` (e.g. `pydantic_ai`'s multi-tool
# test) to skip — used today only for graceful-degradation fallbacks
# whose quant provably can't pass an agent test the model class
# normally can (see qwen3.6 4-bit fallback below). Tiny-model smoke
# tiers (sub-1B) were removed 2026-05-22 — they were dominated by
# model-capability ceilings rather than rapid-mlx bugs, producing
# false-positive failures that wasted reviewer cycles. Other tier
# values (`golden`, `small`, `medium`) carry no functional difference
# today and are applied to whichever candidate the family prefers, NOT
# a guarantee that every candidate so labelled passes the full
# battery — known graceful-degradation fallbacks (e.g. the qwen3.6
# 4-bit fallback for constrained hosts) are still tagged `golden`
# because changing the label would be cosmetic; the per-candidate
# comments document any known degradation.
#   - golden: the family's preferred entry; full agent battery applies.
#   - smoke:  agents marked `skip_for_smoke: true` are suppressed.
#     Used today for graceful-degradation fallbacks (e.g. qwen3.6-4bit)
#     where this *quant* can't pass the multi-tool test even though
#     the model class can — "don't fail the gate on a test the
#     model+quant combo provably can't pass".
#   - small/medium: same battery as `golden`; no functional difference
#     today, used historically to label tier-by-size for the scorecard.
#
# Add new families by appending. Within a family, put the preferred
# candidate first; subsequent entries are graceful-degradation
# fallbacks for hosts that can't fit the preferred one.
#
# `ram_gb_required` should include realistic headroom — weights +
# KV cache for the longest stress prompt + MLX runtime overhead.
# Underestimating triggers OOM at server boot instead of falling
# through to the next candidate. For a quick sanity number: dense
# weights ≈ params × bytes_per_weight; add ~25% for KV/runtime.
families:
  # ------------------------------------------------------------------
  # 0.10.2 PR-2 realignment (2026-07-06): 4 Tier-1 families with strong
  # picks. Small variants (4B / 12B) fail tool-calling for reasons
  # unrelated to the wire path (model 降智 — capability ceiling of the
  # quant/size), which pollutes the correctness signal. Strong picks
  # isolate engine bugs. Priority order per family: 8-bit first (real
  # capacity), 4-bit / smaller fallbacks for constrained hosts.
  # ------------------------------------------------------------------

  - family: qwen3.6
    candidates:
      # PRIMARY: 35B A3B MoE at 8-bit — the Tier-1 Qwen 3.6 strong pick.
      # Kept as the very first candidate so on the maintainer's M3 Ultra
      # (which has ample headroom) this always wins the RAM-fit selection.
      # 27B fallbacks preserved for constrained hosts and CI runners.
      - id: mlx-community/Qwen3.6-35B-A3B-8bit
        # 35 GB weights (MoE — all experts resident) + ~3 GB KV cache for
        # multi-turn tool-call stress + MLX runtime overhead → 42 GB. Fits
        # 64 GB+ M-series with room to spare; drops through on lesser hosts.
        ram_gb_required: 42
        quality_tier: golden
      # FALLBACK: 27B 8-bit for hosts that can't fit 42 GB.
      - id: unsloth/Qwen3.6-27B-MLX-8bit
        ram_gb_required: 36
        quality_tier: golden
      # FALLBACK: 27B 4-bit for very constrained hosts. Tagged ``smoke``
      # because the 4-bit + multi-tool combo empirically rambles without
      # emitting <tool_call> XML (see PR #208 notes).
      - id: mlx-community/Qwen3.6-27B-4bit
        ram_gb_required: 18
        quality_tier: smoke

  - family: gemma4
    candidates:
      # PRIMARY: 31B-IT at 4-bit — the Tier-1 Gemma 4 strong pick. 12B
      # fails tool-calling for reasons unrelated to the wire (documented
      # in 0.10-TODO Don't do list); 31B is the smallest text-only SKU
      # that reliably tool-calls at the router / parser layer.
      # RAM: ~18 GB weights + ~3 GB KV + MLX overhead → 24 GB.
      - id: mlx-community/gemma-4-31b-it-4bit
        ram_gb_required: 24
        quality_tier: golden

  - family: deepseek
    candidates:
      # PRIMARY: DeepSeek V4 Flash at 8-bit — the Tier-1 DeepSeek strong
      # pick. Only currently-shipping Tier-1 DeepSeek MLX quant that
      # exercises the deepseek tool-call parser + deepseek_r1 reasoning
      # parser end-to-end.
      # RAM: ~50 GB weights + ~4 GB KV + MLX overhead → 58 GB.
      - id: mlx-community/DeepSeek-V4-Flash-8bit
        ram_gb_required: 58
        quality_tier: golden

  - family: gptoss
    candidates:
      # PRIMARY: gpt-oss 120B MXFP4-Q8 — the Tier-1 gpt-oss strong pick.
      # 20B lacks reasoning-channel emission on the tool-call path (proven
      # in PR #208 validation), so the 120B strong pick is what actually
      # exercises the Harmony ``analysis`` → reasoning_content routing +
      # ``commentary`` tool-call extraction that Continue #8990 caught.
      # RAM: ~65 GB weights + ~4 GB KV + MLX overhead → 74 GB.
      - id: mlx-community/gpt-oss-120b-MXFP4-Q8
        ram_gb_required: 74
        quality_tier: golden
      # FALLBACK: 20B for hosts that can't fit 74 GB. Loses reasoning-
      # channel coverage but keeps Harmony parser + router smoke alive.
      - id: mlx-community/gpt-oss-20b-MXFP4-Q8
        ram_gb_required: 22
        quality_tier: smoke

# Gemma 4 was previously listed here for orthogonal coverage (different
# chat template + tool-call format) but observed in PR #208 validation
# to fail multiple agent tests due to model-side instruction-following
# weaknesses (writes essays for "Count to 5", refuses to call tools,
# forgets multi-turn context). Per project rule "we want models that
# ~never err so failures cleanly attribute to rapid-mlx", gemma4 does
# not meet the bar today and is excluded from automatic validation.
#
# When mlx-community ships a tighter Gemma 4 instruction-tuned variant
# (or when our Gemma chat template ships better few-shot priming), add
# it back as:
#   - family: gemma4
#     candidates:
#       - id: mlx-community/gemma-4-<NEW_VERSION>
#         ram_gb_required: 14
#         quality_tier: golden
#
# SmolLM3-3B and Granite 4 H-Tiny (added to model_auto_config.py in
# the profile-consolidation PR) were ALSO not added here for the same
# reason. Validation results in that PR:
#   - SmolLM3-3B-4bit: 10/17 across anthropic_sdk + langchain +
#     pydantic_ai — model is too small (3B) to reliably follow
#     tool-call schemas, structured-output schemas, or multi-turn
#     context. Same class of model-side weakness as Gemma 4.
#   - Granite 4 H-Tiny 4bit: 16/17 — borderline, ~94% pass rate. The
#     single fail (pydantic_ai single tool call) is a model-quality
#     edge case (off-topic Java/Spring response). Not flaky enough
#     to block merges, but adding here would gate every PR on it.
# Both families remain available via ``rapid-mlx serve smollm3-3b-4bit``
# and ``rapid-mlx serve granite4-tiny-4bit`` (auto-detected parsers).

# Per-model overrides: extra CLI args (e.g. parser overrides for
# tool-calling tests). Keep small — most models don't need this.
#
# ``--enable-auto-tool-choice`` is required even when the parser is
# auto-detected (model_auto_config picks the parser; the flag toggles
# the API-level OpenAI-style tool-choice routing). The explicit
# ``--tool-call-parser hermes`` is redundant with the registry today
# but documents intent at the validation surface.
overrides:
  # Qwen 3.6: qwen3_coder_xml parser handles <tool_call>...</tool_call>
  # XML emitted by both 35B and 27B checkpoints; ``--enable-auto-tool-choice``
  # toggles the OpenAI-style routing on top.
  "mlx-community/Qwen3.6-35B-A3B-8bit":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder_xml"]
  "unsloth/Qwen3.6-27B-MLX-8bit":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes"]
  "mlx-community/Qwen3.6-27B-4bit":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes"]
  # Gemma 4 31B — gemma4 tool-call parser (OutputRouter allowlist family).
  "mlx-community/gemma-4-31b-it-4bit":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "gemma4"]
  # DeepSeek V4 Flash — deepseek tool-call parser + deepseek_r1 reasoning.
  "mlx-community/DeepSeek-V4-Flash-8bit":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "deepseek"]
  # gpt-oss — Harmony parser handles both <|channel|>commentary tool-call
  # blocks and the final-channel content. The 120B strong pick is what
  # actually exercises the reasoning-channel routing that the 20B lacks.
  "mlx-community/gpt-oss-120b-MXFP4-Q8":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "harmony"]
  "mlx-community/gpt-oss-20b-MXFP4-Q8":
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "harmony"]

# Agent integrations — each is a tests/integrations/ test_X.py script
# we exec against the live server. The matrix is models × agents.
# Tests that already work today; we expand the list as integrations
# stabilize.
agents:
  - name: anthropic_sdk
    script: tests/integrations/test_anthropic_sdk.py
    skip_for_smoke: false
    # diffusiongemma is kept in the matrix for text-diffusion stress and
    # Gemma4 tool-parser smoke, but its simple calculator prompts return
    # empty/"thought" text nondeterministically. That is model quality, not
    # an SDK/router regression signal, so do not hard-block PRs on this agent.
    skip_for_models:
      - mlx-community/diffusiongemma-26B-A4B-it-4bit
  - name: langchain
    script: tests/integrations/test_langchain.py
    skip_for_smoke: false
    # Same diffusiongemma model-quality issue as anthropic_sdk. LangChain's
    # structured-output subtest also requires rapid-mlx[guided], which this
    # validation environment intentionally does not install.
    skip_for_models:
      - mlx-community/diffusiongemma-26B-A4B-it-4bit
  - name: pydantic_ai
    script: tests/integrations/test_pydantic_ai_full.py
    # The multi-tool composition test reliably regresses on quants
    # that can't reach the model class's normal tool-call quality
    # ceiling (today: qwen3.6-27b-4bit). Other agents still run on
    # the smoke-tier fallback; only the test the quant provably
    # can't pass is suppressed.
    skip_for_smoke: true
